<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arx Content Factory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #090D16;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }

        .login-card {
            background: rgba(20, 30, 48, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 44px 40px;
            width: 100%;
            max-width: 440px;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(37, 99, 235, 0.15);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .logo-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 30px;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.6);
        }

        .logo-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #94A3B8;
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #CBD5E1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 18px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.95);
        }

        .btn-login {
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6);
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="login-card">
        <div class="logo-header">
            <div class="logo-icon">A</div>
            <div>
                <div class="logo-title">Arx Content Factory</div>
                <div class="logo-subtitle">Acesso Privado ao Painel de Automação</div>
            </div>
        </div>

        <div id="error-box" class="error-alert">⚠️ Usuário ou senha incorretos!</div>

        <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" id="username" class="form-input" placeholder="Digite seu usuário..." required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" id="password" class="form-input" placeholder="Digite sua senha..." required>
            </div>

            <button type="submit" class="btn-login" id="submit-btn">🔐 Entrar no Painel</button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            const submitBtn = document.getElementById('submit-btn');

            errorBox.style.display = 'none';
            submitBtn.innerText = '⏳ Entrando...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success && data.token) {
                    // Save token in both localStorage and document.cookie for 100% browser compatibility
                    localStorage.setItem('arx_token', data.token);
                    document.cookie = `arx_token=${data.token}; path=/; max-age=864000; SameSite=Lax`;
                    window.location.href = '/dashboard/';
                } else {
                    errorBox.innerText = '⚠️ ' + (data.error || 'Usuário ou senha incorretos!');
                    errorBox.style.display = 'block';
                    submitBtn.innerText = '🔐 Entrar no Painel';
                    submitBtn.disabled = false;
                }
            } catch(err) {
                errorBox.innerText = '⚠️ Erro ao comunicar com o servidor. Tente novamente.';
                errorBox.style.display = 'block';
                submitBtn.innerText = '🔐 Entrar no Painel';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
